<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ไม่พบหน้านี้ | BookingNail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --ink: #273653;
        --muted: #6f7e99;
        --line: #eaddea;
        --primary: #f25b93;
        --primary-dark: #cc3f78;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background:
          radial-gradient(circle at 14% 16%, rgba(141, 207, 255, .36), transparent 28%),
          radial-gradient(circle at 86% 8%, rgba(255, 219, 235, .78), transparent 28%),
          linear-gradient(135deg, #f7f9ff, #fff8fc);
        font-family: "Prompt", ui-sans-serif, system-ui, sans-serif;
      }

      main {
        width: min(460px, 100%);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 22px 56px rgba(205, 78, 130, .14);
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #24406a;
        font-size: clamp(1.6rem, 8vw, 2.2rem);
        line-height: 1.15;
      }

      p {
        margin: 12px 0 22px;
        color: var(--muted);
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        border-radius: 14px;
        padding: 12px 18px;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ไม่พบลิงก์นี้แล้ว</h1>
      <p>ลิงก์เวอร์ชันเก่าถูกปิดใช้งานแล้ว กรุณาใช้ลิงก์ใหม่ของร้าน</p>
      <a href="/fah">ไปหน้าจอง Fah Nail</a>
    </main>
  </body>
</html>
